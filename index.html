<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Balut Store Orders</title>
<style>
:root{ --bg:#f6f3ec; --panel:#fffdf8; --fg:#2b2620; --muted:#7a7166; --line:#e2dbcc; --accent:#b5452b; --accent-fg:#fffdf8; --bad:#a33a2a; color-scheme: light; }
@media (prefers-color-scheme: dark){
  :root{ --bg:#1b1916; --panel:#26231e; --fg:#f1ebe0; --muted:#a39a8b; --line:#3a352d; --accent:#e0745a; --accent-fg:#1b1916; --bad:#e8907f; color-scheme: dark; }
}
body{ margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 Arial,system-ui,sans-serif; padding:16px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); }
.wrap{ max-width:720px; margin:0 auto; display:grid; gap:16px; }
.card{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; min-width:0; }
header{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; }
h1{ font-size:20px; margin:0; }
h2{ font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:0 0 10px; font-weight:600; }
h2.sub{ margin-top:16px; }
.status{ color:var(--muted); font-size:13px; min-height:1.2em; }
.status.bad{ color:var(--bad); }
.grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:10px; }
.item{ display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:10px; border:1px solid var(--line); border-radius:12px; padding:10px 12px; min-width:0; }
.item .name{ font-weight:600; }
.item .detail{ color:var(--muted); font-size:13px; }
.item .price{ font-size:13px; font-variant-numeric:tabular-nums; }
.qty{ display:flex; align-items:center; gap:6px; flex:none; }
.qty .n{ font-size:22px; font-weight:700; min-width:2ch; text-align:center; font-variant-numeric:tabular-nums; }
button{ font:inherit; color:var(--fg); background:var(--panel); border:1px solid var(--line); border-radius:10px; min-height:44px; padding:0 14px; cursor:pointer; touch-action:manipulation; }
button:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
button:disabled{ opacity:.45; cursor:default; }
button.round{ width:40px; height:40px; min-height:40px; padding:0; border-radius:50%; font-size:22px; line-height:1; display:grid; place-items:center; flex:none; }
button.plus{ background:var(--accent); color:var(--accent-fg); border-color:var(--accent); }
button.primary{ background:var(--accent); color:var(--accent-fg); border-color:var(--accent); font-weight:600; }
.summary{ display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-top:16px; padding-top:14px; border-top:1px solid var(--line); }
.summary .lines{ color:var(--muted); font-size:14px; min-width:0; overflow-wrap:anywhere; }
.actions{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.total{ font-size:24px; font-weight:700; font-variant-numeric:tabular-nums; }
.stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; }
.stat{ border:1px solid var(--line); border-radius:12px; padding:12px; }
.stat .k{ color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.06em; }
.stat .v{ font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Balut Store Orders</h1>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </header>

  <section class="card">
    <h2>New order</h2>
    <h2 class="sub">Sets (bulk price)</h2>
    <div class="grid" id="sets"></div>
    <h2 class="sub">Items</h2>
    <div class="grid" id="items"></div>
    <div class="summary">
      <div class="lines" id="lines">Tap + to add sets or items.</div>
      <div class="actions">
        <div class="total" id="total">₱0.00</div>
        <button id="clear" type="button">Clear</button>
        <button id="save" class="primary" type="button">Save order</button>
      </div>
    </div>
  </section>

  <section class="card">
    <h2>Today's sales</h2>
    <div class="stats">
      <div class="stat"><div class="k">Sales</div><div class="v" id="s-total">—</div></div>
      <div class="stat"><div class="k">Orders</div><div class="v" id="s-orders">—</div></div>
    </div>
  </section>
</div>

<script>
// ===== Set these two values after you set up the Apps Script =====
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby2E5MJyTMkbTCc8rCcXp6nFN294N204-rfZ7YkduU_mK3KihkwiAdylkXh2uWzecbS/exec';
const SECRET = 'CHANGE-ME-TO-YOUR-SECRET';   // must match SECRET in Code.gs

// Same keys, names and prices as Code.gs. The server computes the real totals.
const CATALOG = [
  {key:'setA', name:'Set A', detail:'1 balut + 2 penoy', price:60, set:true},
  {key:'setB', name:'Set B', detail:'2 balut + 1 penoy', price:70, set:true},
  {key:'setC', name:'Set C', detail:'4 balut', price:110, set:true},
  {key:'setD', name:'Set D', detail:'6 balut', price:180, set:true},
  {key:'balut', name:'Balut', price:24},
  {key:'penoy', name:'Penoy', price:16},
  {key:'soda8oz', name:'8 oz soda', price:15},
  {key:'siomai', name:'Siomai', price:35},
  {key:'soda1l', name:'1 liter soda', price:50},
  {key:'chicharon', name:'Chicharon', price:10},
  {key:'junkfood', name:'Junkfood', price:10},
  {key:'chiligarlic', name:'Chili garlic', price:15},
  {key:'venida', name:'Venida juice', price:35},
  {key:'candies', name:'Candies', price:2},
  {key:'water1l', name:'1 liter water', price:30},
  {key:'water500', name:'500 ml water', price:15},
];

let counts = {};
let saving = false;

const $ = id => document.getElementById(id);
const peso = n => '₱' + Number(n || 0).toLocaleString('en-PH', {minimumFractionDigits:2, maximumFractionDigits:2});

function el(tag, props = {}, kids = []) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') n.className = v;
    else if (k === 'on') for (const [ev, fn] of Object.entries(v)) n.addEventListener(ev, fn);
    else if (k === 'text') n.textContent = v;
    else if (v === null || v === false) continue;
    else n.setAttribute(k, v);
  }
  for (const k of kids) n.append(k);
  return n;
}

function setStatus(msg, bad = false) {
  $('status').textContent = msg;
  $('status').classList.toggle('bad', bad);
}

function orderLines() {
  return CATALOG.filter(c => (counts[c.key] || 0) > 0).map(c => ({
    name: c.name, qty: counts[c.key], amount: counts[c.key] * c.price,
  }));
}

function change(key, delta) {
  counts[key] = Math.max(0, (counts[key] || 0) + delta);
  renderPad();
}

function card(c) {
  const q = counts[c.key] || 0;
  return el('div', {class:'item'}, [
    el('div', {}, [
      el('div', {class:'name', text: c.name}),
      el('div', {class:'detail', text: c.detail || ''}),
      el('div', {class:'price', text: peso(c.price)}),
    ]),
    el('div', {class:'qty'}, [
      el('button', {type:'button', class:'round', 'aria-label': 'Remove one ' + c.name,
        disabled: q === 0 ? '' : null, on:{click: () => change(c.key, -1)}}, [document.createTextNode('−')]),
      el('span', {class:'n', text: String(q)}),
      el('button', {type:'button', class:'round plus', 'aria-label': 'Add one ' + c.name,
        on:{click: () => change(c.key, 1)}}, [document.createTextNode('+')]),
    ]),
  ]);
}

function renderPad() {
  $('sets').replaceChildren(...CATALOG.filter(c => c.set).map(card));
  $('items').replaceChildren(...CATALOG.filter(c => !c.set).map(card));

  const lines = orderLines();
  const total = lines.reduce((a, l) => a + l.amount, 0);
  $('lines').textContent = lines.length
    ? lines.map(l => `${l.qty}× ${l.name}`).join(', ')
    : 'Tap + to add sets or items.';
  $('total').textContent = peso(total);
  $('save').disabled = saving || lines.length === 0;
  $('clear').disabled = lines.length === 0;
}

async function saveOrder() {
  if (saving || orderLines().length === 0) return;
  saving = true;
  renderPad();
  try {
    const res = await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify({secret: SECRET, counts}),
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Not saved');
    counts = {};
    setStatus('Order saved: ' + peso(data.total));
    loadToday();
  } catch (e) {
    setStatus('Could not save. Check the internet and try again. (' + e.message + ')', true);
  } finally {
    saving = false;
    renderPad();
  }
}

async function loadToday() {
  try {
    const res = await fetch(SCRIPT_URL);
    const data = await res.json();
    $('s-total').textContent = peso(data.sales);
    $('s-orders').textContent = String(data.orders);
  } catch (e) {
    setStatus('Could not load today\'s sales. Check the internet.', true);
  }
}

$('save').addEventListener('click', saveOrder);
$('clear').addEventListener('click', () => { counts = {}; renderPad(); });

renderPad();
if (SCRIPT_URL.startsWith('https://')) loadToday();
else setStatus('Set SCRIPT_URL and SECRET in this file first.', true);
</script>
</body>
</html>
